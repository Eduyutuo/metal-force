name: Deploy Metal Force to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site for the project URL
        shell: bash
        run: |
          cp -R dist pages
          find pages -type f -name '*.html' -print0 | xargs -0 sed -i \
            -e 's|href="/|href="/metal-force/|g' \
            -e 's|src="/|src="/metal-force/|g'
          sed -i "s|url('/|url('/metal-force/|g" pages/styles.css

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
